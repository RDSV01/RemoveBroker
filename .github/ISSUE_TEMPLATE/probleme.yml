name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Ne collez jamais vos données personnelles**: adresse email complète,
        adresse postale, numéro de téléphone. Remplacez-les par `[email]`,
        `[adresse]`. Un rapport de bug est public et indexé.

        Pour une faille de sécurité, n'utilisez pas ce formulaire: voir
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: probleme
    attributes:
      label: Ce qui s'est passé
      description: Et ce que vous attendiez à la place.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir Paramètres, Messagerie
        2. Renseigner un compte Gmail
        3. Cliquer sur Tester la connexion
        4. Le message d'erreur apparaît
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Affichée en bas de la barre latérale
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Mode d'installation
      options:
        - Installateur Windows
        - Application macOS
        - AppImage ou paquet Linux
        - Depuis les sources
        - Docker
    validations:
      required: true

  - type: input
    id: systeme
    attributes:
      label: Système
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"

  - type: textarea
    id: journal
    attributes:
      label: Extrait du journal
      description: Paramètres, Confidentialité, Ouvrir le journal. Retirez toute donnée personnelle avant de coller.
      render: text
