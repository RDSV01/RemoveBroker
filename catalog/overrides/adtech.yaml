    domain: kochava.com
    website: https://www.kochava.com
    optOutUrl: https://www.kochava.com/opt-out-do-not-sell-request-process/
    category: location
    regions: [us, eu, intl]
    notes: Poursuivi par la FTC pour la revente de données de localisation sensibles. Le formulaire demande chaque identifiant publicitaire séparément.

