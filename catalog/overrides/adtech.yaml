# Publicité ciblée, localisation et graphes d'identité.
#
# C'est le coeur du sujet et la partie la plus mal couverte par les sources
# publiques. Ces sociétés ne vous connaissent souvent ni par votre nom ni par
# votre adresse email, mais par l'identifiant publicitaire de votre téléphone
# (IDFA sur iPhone, AAID sur Android) et par les traces de déplacement qui y
# sont rattachées.
#
# Conséquence pratique: une demande envoyée sans cet identifiant a peu de
# chances d'aboutir chez un courtier de localisation. RemoveBroker le demande
# donc dans le profil, en option, et l'inclut dans les demandes de cette
# catégorie.
#
# Catégories utilisées ici:
#   location   -> revente de traces de déplacement rattachées à un identifiant
#   marketing  -> segments d'audience, graphes d'identité, régies

brokers:
