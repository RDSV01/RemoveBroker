  # Filiale donnees de WPP, groupe britannique. Sa page de politique n'est
  # qu'un selecteur de langue: le detecteur automatique n'y voit aucune mention
  # du droit europeen et l'ecarterait. Elle repond pourtant aux demandes RGPD,
  # constate sur une reponse reelle le 19 aout 2026.
  - patch: true
    domain: choreograph.com
