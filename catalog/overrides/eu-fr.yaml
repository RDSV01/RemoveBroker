# Courtiers en données actifs en Europe et en France.
#
# Aucun registre public obligatoire n'existe côté UE, contrairement au registre
# CPPA californien. Cette liste est donc curatée à la main: c'est ici qu'il faut
# contribuer pour améliorer la couverture européenne, qui est la priorité du
# projet.
#
# Les adresses de contact manquantes sont complétées automatiquement par
# scripts/enrich-catalog.mjs, qui lit la politique de confidentialité publiée
# par chaque société et y cherche une adresse de délégué à la protection des
# données. Ne renseignez `email:` à la main que si vous l'avez vérifiée.
#
# Deux types d'entrées:
#   1. entrée complète  -> ajoute un courtier absent des sources publiques
#   2. patch: true      -> corrige une entrée existante, identifiée par `domain`
#
# Champs: name, domain, website, email, optOutUrl, category, regions,
#         requiresId, notes, guideUrl
# Catégories: people-search phone-directory background-check b2b business-search
#             marketing location credit-risk health other

brokers:
  # --- Annuaires et recherche de personnes, France -------------------------
  - name: Solocal (PagesJaunes)
    domain: pagesjaunes.fr
    website: https://www.pagesjaunes.fr
    email: dpo@solocal.com
    optOutUrl: https://www.pagesjaunes.fr/protection-donnees-personnelles
    category: phone-directory
    regions: [eu, fr]
    notes: Éditeur de PagesJaunes et PagesBlanches. Demander la suppression de la fiche et l'opposition à la diffusion de l'annuaire universel.

  - name: 118 712 (Le Numéro)
    domain: 118712.fr
    website: https://www.118712.fr
    category: phone-directory
    regions: [eu, fr]
    notes: Service de renseignements téléphoniques. L'opposition passe aussi par la liste rouge de votre opérateur.

  - name: Annuaire Pages Blanches
    domain: pagesblanches.fr
    website: https://www.pagesblanches.fr
    # pagesblanches.fr redirige vers pagesjaunes.fr/pagesblanches: le
    # responsable de traitement est Solocal, qui publie cette adresse pour
    # l'exercice des droits. Vérifié le 20 août 2026.
    email: dpo@solocal.com
    optOutUrl: https://www.pagesjaunes.fr/protection-donnees-personnelles
    category: phone-directory
    regions: [eu, fr]

  - name: Copains d'avant
    domain: linternaute.com
    website: https://copainsdavant.linternaute.com
    category: people-search
    regions: [eu, fr]
    notes: Profils anciens souvent indexés par les moteurs de recherche.

  - name: Trombi
    domain: trombi.com
    website: https://www.trombi.com
    category: people-search
    regions: [eu, fr]

